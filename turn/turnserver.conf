# Configurazione minima di coturn per il Testbed WebRTC di Space Invasion.
# Riferimento: https://github.com/coturn/coturn
#
# Scopo: fornire un server TURN che il client WebRTC (frontend/src/config.ts, ICE_SERVERS +
# FORCE_TURN_RELAY) puo' usare per instradare il DataChannel "game" attraverso un relay remoto,
# invece del percorso diretto peer-to-peer che sceglierebbe normalmente in rete locale. Questo
# replica la stessa topologia a due hop (client -> relay -> client) del relay MoQ, cosi' il
# confronto tra le due tecnologie misura davvero il trasporto e non "locale vs remoto".

# Porta TURN standard (UDP+TCP). Se sulla macchina di deployment questa porta non e' aperta,
# ma lo e' la 443 (spesso l'unica libera dietro firewall/NAT restrittivi), si puo' impostare
# listening-port=443 al suo posto: e' una pratica comune per i server TURN pubblici.
listening-port=3478

# Porta TURN su TLS (turns:), opzionale ma consigliata se il client si connette da HTTPS
# (mixed-content: da una pagina https:// il browser puo' rifiutarsi di usare turn: in chiaro).
# Richiede un certificato valido: vedi cert-file/pkey-file sotto.
tls-listening-port=5349

# Range di porte usate per il relay effettivo dei dati (RTP/dati applicativi) verso i client.
# Deve essere aperto (UDP) sul firewall della macchina che ospita coturn.
min-port=49152
max-port=49452

# Meccanismo a credenziali statiche (piu' semplice da configurare per un testbed di ricerca
# rispetto alle credenziali "time-limited" con secret condiviso).
lt-cred-mech
realm=space-invasion.local

# Utente/password di test: CAMBIARE prima di esporre il server pubblicamente, e riportare le
# stesse credenziali in frontend/src/config.ts (TURN_USERNAME / TURN_CREDENTIAL).
user=spaceinvasion:CHANGE_ME_PASSWORD

# Certificato TLS per tls-listening-port (necessario solo se si usa turns:). Sostituire con i
# path reali (es. gli stessi certificati Let's Encrypt gia' usati dal relay MoQ/dal frontend).
# cert-file=/etc/coturn/certs/fullchain.pem
# pkey-file=/etc/coturn/certs/privkey.pem

# Impedisce a coturn di fare da relay verso indirizzi privati/loopback: buona norma di
# sicurezza, non necessaria per il funzionamento del testbed.
no-loopback-peers
no-multicast-peers

fingerprint
no-cli
no-tlsv1
no-tlsv1_1

# Log leggibili per debug rapido durante gli esperimenti; volendo si puo' aumentare la verbosita'
# con -v/-V passato al comando turnserver.
log-file=stdout
