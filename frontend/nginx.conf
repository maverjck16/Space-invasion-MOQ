server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # I bundle JS/CSS generati da Vite hanno l'hash del contenuto nel nome del file: possono
    # essere cachati a lungo dal browser, tanto ogni build che cambia qualcosa produce un nome
    # diverso, invalidando automaticamente la cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html e gli scenari del testbed NON vanno mai cachati dal browser: dopo ogni
    # "docker compose up -d --build" devono sempre arrivare aggiornati. Senza questa regola,
    # index.html cachato dal browser continua a puntare a un bundle JS con hash ormai inesistente
    # dopo un rebuild -> 404 sul bundle e pagina bianca (visto dal vivo il 22/09/2026).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /scenarios/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
